<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>РЫЖИДЕНТ ИГОРЬ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0f0f14; font-family: Arial, sans-serif;
    touch-action: none; user-select: none;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 12px; opacity: 0; transition: opacity 0.3s;
  }
  #ui.visible { opacity: 1; }
  #hud { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #hpWrap {
    width: min(300px, 45vw); height: 26px; background: #3c3c3c;
    border: 2px solid #fff; border-radius: 4px; overflow: hidden; position: relative;
  }
  #hpBar { height: 100%; width: 100%; background: #3cc83c; transition: width 0.1s; }
  #hpText {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 14px; font-weight: bold;
    text-shadow: 1px 1px 2px #000;
  }
  #stats { text-align: right; color: #ffdc3c; font-size: clamp(14px, 2.5vw, 22px); font-weight: bold; text-shadow: 1px 1px 2px #000; line-height: 1.3; }
  #stats small { color: #fff; font-size: 0.75em; font-weight: normal; }
  #controls {
    display: flex; justify-content: space-between; align-items: flex-end;
    pointer-events: none; margin-bottom: 10px;
  }
  #joyZone {
    width: 150px; height: 150px; border-radius: 50%;
    background: rgba(80,80,80,0.35); border: 2px solid rgba(200,200,200,0.5);
    position: relative; pointer-events: auto;
  }
  #joyKnob {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(200,200,200,0.7); border: 2px solid #fff;
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    pointer-events: none;
  }
  #fireBtn {
    width: 110px; height: 110px; border-radius: 50%;
    background: rgba(220,40,40,0.6); border: 3px solid rgba(255,255,255,0.7);
    color: #fff; font-weight: bold; font-size: 16px; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 1px 1px 2px #000;
  }
  #fireBtn:active { background: rgba(255,80,80,0.85); transform: scale(0.95); }
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 20px; z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay h1 { color: #dc2828; font-size: clamp(28px, 6vw, 60px); margin-bottom: 20px; }
  #overlay p { font-size: clamp(16px, 3vw, 24px); margin-bottom: 12px; }
  #overlay .btn {
    margin-top: 20px; padding: 14px 32px; font-size: 20px; font-weight: bold;
    background: #ffc83c; color: #000; border: none; border-radius: 8px; cursor: pointer;
  }
  @media (max-width: 600px) {
    #joyZone { width: 120px; height: 120px; }
    #joyKnob { width: 50px; height: 50px; }
    #fireBtn { width: 90px; height: 90px; font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="hud">
    <div id="hpWrap"><div id="hpBar"></div><div id="hpText">HP: 100</div></div>
    <div id="stats">Очки: <span id="scoreVal">0</span><br><small>Волна: <span id="waveVal">1</span> | Убито: <span id="killVal">0</span></small></div>
  </div>
  <div id="controls">
    <div id="joyZone"><div id="joyKnob"></div></div>
    <div id="fireBtn">СТРЕЛЯТЬ</div>
  </div>
</div>

<div id="overlay">
  <h1>ИГОРЬ ПАЛ В БОЮ</h1>
  <p>Очки: <b id="ovScore">0</b> | Убито: <b id="ovKills">0</b> | Волна: <b id="ovWave">1</b></p>
  <button class="btn" onclick="restart()">Играть снова</button>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = window.innerWidth, H = window.innerHeight;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- Звук ----
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function playTone(opt) {
    const freq = opt.freq || 800;
    const freqEnd = opt.freqEnd || 300;
    const dur = opt.dur || 0.08;
    const type = opt.type || "sine";
    const vol = opt.vol || 0.15;
    const noise = opt.noise || 0;
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur);
    if (noise > 0) {
      const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
      const src = audioCtx.createBufferSource();
      const g2 = audioCtx.createGain(); g2.gain.value = noise;
      src.buffer = buf; src.connect(g2); g2.connect(audioCtx.destination);
      src.start(now);
    }
  }

  const SFX = {
    shoot: function(){ playTone({freq:1100,freqEnd:280,dur:0.08,type:"square",vol:0.08,noise:0.05}); },
    hit:   function(){ playTone({freq:220,freqEnd:120,dur:0.08,type:"triangle",vol:0.15,noise:0.1}); },
    hurt:  function(){ playTone({freq:400,freqEnd:100,dur:0.15,type:"sawtooth",vol:0.12}); },
    growl: function(){ playTone({freq:90,freqEnd:60,dur:0.45,type:"sawtooth",vol:0.08,noise:0.08}); },
    wave:  function(){ playTone({freq:300,freqEnd:900,dur:0.3,type:"square",vol:0.1}); },
    death: function(){ playTone({freq:300,freqEnd:40,dur:0.8,type:"sawtooth",vol:0.2,noise:0.15}); },
    pickup:function(){ playTone({freq:500,freqEnd:1200,dur:0.2,type:"sine",vol:0.2}); },
    start: function(){ playTone({freq:200,freqEnd:800,dur:0.4,type:"square",vol:0.12}); }
  };

  // ---- Состояние ----
  let state = null;
  let screenMode = "splash";
  let splashTime = 0;

  function resetState() {
    state = {
      player: { x: W/2, y: H/2, r: 20, hp: 100, maxHp: 100, speed: 220, angle: 0, cooldown: 0 },
      bullets: [],
      zombies: [],
      medkits: [],
      particles: [],
      score: 0, kills: 0,
      wave: 1, waveKills: 0, waveTarget: 8,
      spawnTimer: 0, spawnInterval: 1.2,
      gameOver: false,
      time: 0,
      growlTimer: 3
    };
    document.getElementById("overlay").classList.remove("show");
    updateHUD();
  }

  // ---- Управление ----
  const keys = {};
  window.addEventListener("keydown", function(e) {
    keys[e.key.toLowerCase()] = true;
    if (e.key === " ") e.preventDefault();
  });
  window.addEventListener("keyup", function(e) { keys[e.key.toLowerCase()] = false; });

  let mouse = { x: W/2, y: H/2, down: false };
  canvas.addEventListener("mousemove", function(e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  canvas.addEventListener("mousedown", function(e) { if (e.button === 0) { mouse.down = true; ensureAudio(); } });
  window.addEventListener("mouseup", function() { mouse.down = false; });
  canvas.addEventListener("contextmenu", function(e) { e.preventDefault(); });

  const joyZone = document.getElementById("joyZone");
  const joyKnob = document.getElementById("joyKnob");
  const joy = { active: false, id: null, dx: 0, dy: 0 };

  function joyPos() {
    const r = joyZone.getBoundingClientRect();
    return { cx: r.left + r.width/2, cy: r.top + r.height/2, r: r.width/2 };
  }

  joyZone.addEventListener("touchstart", function(e) {
    e.preventDefault(); ensureAudio();
    const t = e.changedTouches[0];
    joy.active = true; joy.id = t.identifier;
    updateJoy(t.clientX, t.clientY);
  }, { passive: false });

  joyZone.addEventListener("touchmove", function(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joy.id) updateJoy(t.clientX, t.clientY);
    }
  }, { passive: false });

  function endJoy(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joy.id) {
        joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
        joyKnob.style.transform = "translate(-50%,-50%)";
      }
    }
  }
  joyZone.addEventListener("touchend", endJoy);
  joyZone.addEventListener("touchcancel", endJoy);

  joyZone.addEventListener("mousedown", function(e) { ensureAudio(); joy.active = true; updateJoy(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function(e) { if (joy.active && joy.id === null) updateJoy(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function() {
    if (joy.id === null) { joy.active = false; joy.dx = 0; joy.dy = 0; joyKnob.style.transform = "translate(-50%,-50%)"; }
  });

  function updateJoy(px, py) {
    const p = joyPos();
    let dx = px - p.cx, dy = py - p.cy;
    const d = Math.hypot(dx, dy) || 1;
    const maxR = p.r - 25;
    if (d > maxR) { dx = dx/d*maxR; dy = dy/d*maxR; }
    joy.dx = dx / maxR;
    joy.dy = dy / maxR;
    joyKnob.style.transform = "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px))";
  }

  let fireHeld = false;
  const fireBtn = document.getElementById("fireBtn");
  fireBtn.addEventListener("touchstart", function(e) { e.preventDefault(); ensureAudio(); fireHeld = true; }, { passive: false });
  fireBtn.addEventListener("touchend", function(e) { e.preventDefault(); fireHeld = false; }, { passive: false });
  fireBtn.addEventListener("touchcancel", function() { fireHeld = false; });
  fireBtn.addEventListener("mousedown", function(e) { e.preventDefault(); ensureAudio(); fireHeld = true; });
  window.addEventListener("mouseup", function() { fireHeld = false; });

  // ---- Объекты ----
  function spawnZombie() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = Math.random() * W; y = -30; }
    else if (side === 1) { x = Math.random() * W; y = H + 30; }
    else if (side === 2) { x = -30; y = Math.random() * H; }
    else { x = W + 30; y = Math.random() * H; }
    const tough = Math.random() < 0.2;
    state.zombies.push({
      x: x, y: y, r: tough ? 26 : 18,
      hp: tough ? 4 : 2, maxHp: tough ? 4 : 2,
      speed: (tough ? 40 : 65) + Math.random() * 30,
      flash: 0, growlTimer: 2 + Math.random() * 5, tough: tough
    });
  }

  function spawnMedkit(x, y) {
    state.medkits.push({
      x: x, y: y, r: 14,
      vy: 25,
      swayPhase: Math.random() * Math.PI * 2,
      swayAmp: 20,
      age: 0,
      landed: false,
      groundY: Math.max(60, Math.min(y, H - 80))
    });
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 50 + Math.random() * 150;
      state.particles.push({
        x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
        life: 0.5, maxLife: 0.5, color: color, r: 2 + Math.random()*3
      });
    }
  }

  function shootAt(tx, ty) {
    const p = state.player;
    if (p.cooldown > 0) return;
    p.cooldown = 0.22;
    const a = Math.atan2(ty - p.y, tx - p.x);
    p.angle = a;
    state.bullets.push({
      x: p.x + Math.cos(a) * p.r,
      y: p.y + Math.sin(a) * p.r,
      vx: Math.cos(a) * 700,
      vy: Math.sin(a) * 700,
      r: 5
    });
    SFX.shoot();
  }

  function closestZombie() {
    if (!state.zombies.length) return null;
    const p = state.player;
    let best = null, bd = Infinity;
    for (let i = 0; i < state.zombies.length; i++) {
      const z = state.zombies[i];
      const d = (z.x-p.x)*(z.x-p.x) + (z.y-p.y)*(z.y-p.y);
      if (d < bd) { bd = d; best = z; }
    }
    return best;
  }

  // ---- Обновление ----
  function update(dt) {
    if (state.gameOver) return;
    state.time += dt;
    const p = state.player;

    let mx = 0, my = 0;
    if (joy.active) { mx = joy.dx; my = joy.dy; }
    if (keys["w"] || keys["arrowup"]) my -= 1;
    if (keys["s"] || keys["arrowdown"]) my += 1;
    if (keys["a"] || keys["arrowleft"]) mx -= 1;
    if (keys["d"] || keys["arrowright"]) mx += 1;
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    p.x += mx * p.speed * dt;
    p.y += my * p.speed * dt;
    p.x = Math.max(p.r, Math.min(W - p.r, p.x));
    p.y = Math.max(p.r, Math.min(H - p.r, p.y));

    if (p.cooldown > 0) p.cooldown -= dt;

    const target = closestZombie();
    const isTouch = ("ontouchstart" in window);
    let aimX, aimY;
    if (isTouch && target) { aimX = target.x; aimY = target.y; }
    else { aimX = mouse.x; aimY = mouse.y; }
    p.angle = Math.atan2(aimY - p.y, aimX - p.x);

    const wantShoot = fireHeld || mouse.down || keys[" "];
    if (wantShoot) {
      if (isTouch && target) shootAt(target.x, target.y);
      else shootAt(mouse.x, mouse.y);
    }

    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnInterval) {
      state.spawnTimer = 0;
      spawnZombie();
    }

    state.growlTimer -= dt;
    if (state.growlTimer <= 0) { SFX.growl(); state.growlTimer = 4 + Math.random() * 6; }

    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20) {
        state.bullets.splice(i, 1);
      }
    }

    for (let i = state.zombies.length - 1; i >= 0; i--) {
      const z = state.zombies[i];
      const dx = p.x - z.x, dy = p.y - z.y;
      const d = Math.hypot(dx, dy) || 1;
      z.x += dx/d * z.speed * dt;
      z.y += dy/d * z.speed * dt;
      if (z.flash > 0) z.flash -= dt;

      if (d < z.r + p.r - 5) {
        p.hp -= 25 * dt;
        if (Math.random() < dt * 3) SFX.hurt();
        if (p.hp <= 0) { p.hp = 0; gameOver(); return; }
      }

      for (let j = state.bullets.length - 1; j >= 0; j--) {
        const b = state.bullets[j];
        const bdx = b.x - z.x, bdy = b.y - z.y;
        if (bdx*bdx + bdy*bdy < (z.r + b.r)*(z.r + b.r)) {
          z.hp -= 1; z.flash = 0.1;
          state.bullets.splice(j, 1);
          spawnParticles(b.x, b.y, "#8a0a0a", 5);
          SFX.hit();
          if (z.hp <= 0) {
            spawnParticles(z.x, z.y, "#3ca03c", 12);
            if (Math.random() < 0.2) spawnMedkit(z.x, z.y);
            state.zombies.splice(i, 1);
            state.score += z.tough ? 25 : 10;
            state.kills++;
            state.waveKills++;
          }
          break;
        }
      }
    }

    for (let i = state.medkits.length - 1; i >= 0; i--) {
      const m = state.medkits[i];
      m.age += dt;
      if (!m.landed) {
        m.groundY += m.vy * dt;
        if (m.groundY >= H - 50) { m.groundY = H - 50; m.landed = true; }
      }
      const sway = m.landed ? 0 : Math.sin(m.age * 3 + m.swayPhase) * m.swayAmp;
      const cx = m.x + sway;
      const d = Math.hypot(cx - p.x, m.groundY - p.y);
      if (d < m.r + p.r + 10) {
        p.hp = Math.min(p.maxHp, p.hp + 25);
        spawnParticles(cx, m.groundY, "#ff5050", 10);
        SFX.pickup();
        state.medkits.splice(i, 1);
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.92; pt.vy *= 0.92;
      pt.life -= dt;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }

    if (state.waveKills >= state.waveTarget) {
      state.waveKills = 0;
      state.wave++;
      state.waveTarget += 4;
      state.spawnInterval = Math.max(0.35, state.spawnInterval - 0.1);
      p.hp = Math.min(p.maxHp, p.hp + 15);
      SFX.wave();
    }

    updateHUD();
  }

  function updateHUD() {
    const p = state.player;
    const ratio = Math.max(0, p.hp / p.maxHp);
    const bar = document.getElementById("hpBar");
    bar.style.width = (ratio * 100) + "%";
    bar.style.background = "rgb(" + Math.round(220*(1-ratio)+40*ratio) + "," + Math.round(220*ratio) + ",40)";
    document.getElementById("hpText").textContent = "HP: " + Math.ceil(p.hp);
    document.getElementById("scoreVal").textContent = state.score;
    document.getElementById("waveVal").textContent = state.wave;
    document.getElementById("killVal").textContent = state.kills;
  }

  function gameOver() {
    state.gameOver = true;
    SFX.death();
    document.getElementById("ovScore").textContent = state.score;
    document.getElementById("ovKills").textContent = state.kills;
    document.getElementById("ovWave").textContent = state.wave;
    document.getElementById("overlay").classList.add("show");
  }

  // ---- Отрисовка ----
  function drawBackground() {
    ctx.fillStyle = "#1e1e28";
    ctx.fillRect(0, 0, W, H);
    const grid = 60;
    const t = state ? state.time : splashTime;
    const off = (t * 15) % grid;
    ctx.strokeStyle = "#28283c";
    ctx.lineWidth = 1;
    for (let x = -off; x < W; x += grid) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = -off; y < H; y += grid) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawPlayer(p) {
    ctx.fillStyle = "#3c64a0";
    ctx.fillRect(p.x - 13, p.y - 7, 26, 30);
    ctx.fillStyle = "#ffc896";
    ctx.beginPath(); ctx.arc(p.x, p.y - 14, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ff781e";
    ctx.beginPath(); ctx.arc(p.x, p.y - 18, 12, Math.PI, 0); ctx.fill();
    ctx.fillRect(p.x - 12, p.y - 18, 24, 6);
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(p.x - 4, p.y - 14, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x + 4, p.y - 14, 2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#505050";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(p.angle)*24, p.y + Math.sin(p.angle)*24);
    ctx.stroke();
    ctx.fillStyle = "#282828";
    ctx.beginPath();
    ctx.arc(p.x + Math.cos(p.angle)*24, p.y + Math.sin(p.angle)*24, 4, 0, Math.PI*2);
    ctx.fill();
  }

  function drawZombie(z) {
    const flash = z.flash > 0;
    ctx.fillStyle = flash ? "#c8ffc8" : "#1e781e";
    ctx.fillRect(z.x - z.r*0.6, z.y - z.r*0.2, z.r*1.2, z.r*1.3);
    ctx.fillStyle = flash ? "#c8ffc8" : "#3cc83c";
    ctx.beginPath(); ctx.arc(z.x, z.y - z.r*0.6, z.r*0.55, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#dc2828";
    ctx.beginPath(); ctx.arc(z.x - z.r*0.2, z.y - z.r*0.65, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(z.x + z.r*0.2, z.y - z.r*0.65, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#8c0a0a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(z.x - z.r*0.2, z.y - z.r*0.4);
    ctx.lineTo(z.x + z.r*0.2, z.y - z.r*0.4);
    ctx.stroke();
    if (z.tough && z.hp < z.maxHp) {
      ctx.fillStyle = "#000";
      ctx.fillRect(z.x - 15, z.y - z.r - 12, 30, 5);
      ctx.fillStyle = "#dc2828";
      ctx.fillRect(z.x - 15, z.y - z.r - 12, 30 * (z.hp/z.maxHp), 5);
    }
  }

  function drawBullet(b) {
    ctx.fillStyle = "#ffdc3c";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#ff781e";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.stroke();
  }

  function drawParticle(pt) {
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawMedkit(m) {
    const sway = m.landed ? 0 : Math.sin(m.age * 3 + m.swayPhase) * m.swayAmp;
    const cx = m.x + sway;
    const cy = m.groundY;
    const r = m.r;

    if (!m.landed) {
      const canopyY = cy - r - 35;
      ctx.fillStyle = "#dc2828";
      ctx.beginPath();
      ctx.arc(cx, canopyY, r + 10, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, canopyY); ctx.lineTo(cx - (r+10), canopyY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, canopyY); ctx.lineTo(cx + (r+10), canopyY); ctx.stroke();
      ctx.strokeStyle = "#c8c8c8";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx - (r+8), canopyY + 2); ctx.lineTo(cx - r*0.6, cy - r*0.3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + (r+8), canopyY + 2); ctx.lineTo(cx + r*0.6, cy - r*0.3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, canopyY - (r+10)); ctx.lineTo(cx, cy - r*0.3); ctx.stroke();
    }

    ctx.fillStyle = "#f0f0f0";
    ctx.fillRect(cx - r, cy - r*0.6, r*2, r*1.2);
    ctx.strokeStyle = "#a0a0a0";
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - r, cy - r*0.6, r*2, r*1.2);
    ctx.fillStyle = "#dc2828";
    ctx.fillRect(cx - 3, cy - r*0.35, 6, r*0.7);
    ctx.fillRect(cx - r*0.35, cy - 3, r*0.7, 6);

    if (m.landed) {
      ctx.globalAlpha = 0.3 + 0.2 * Math.sin(m.age * 5);
      ctx.fillStyle = "#ff5050";
      ctx.beginPath(); ctx.arc(cx, cy, r + 6, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawCrosshair() {
    if ("ontouchstart" in window) return;
    ctx.strokeStyle = "#dc2828";
    ctx.lineWidth = 2;
    const x = mouse.x, y = mouse.y;
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-14, y); ctx.lineTo(x-6, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+6, y); ctx.lineTo(x+14, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y-14); ctx.lineTo(x, y-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y+6); ctx.lineTo(x, y+14); ctx.stroke();
  }

  function render() {
    drawBackground();
    for (let i = 0; i < state.medkits.length; i++) drawMedkit(state.medkits[i]);
    for (let i = 0; i < state.zombies.length; i++) drawZombie(state.zombies[i]);
    for (let i = 0; i < state.bullets.length; i++) drawBullet(state.bullets[i]);
    for (let i = 0; i < state.particles.length; i++) drawParticle(state.particles[i]);
    drawPlayer(state.player);
    drawCrosshair();
  }

  // ---- Заставка ----
  function drawSplash() {
    const t = splashTime;
    const fade = Math.min(1, t / 1.2);

    ctx.fillStyle = "#0f0f14";
    ctx.fillRect(0, 0, W, H);

    // Сетка
    const grid = 50;
    const off = (t * 20) % grid;
    ctx.strokeStyle = "rgba(120, 60, 30, " + (0.12 * fade) + ")";
    ctx.lineWidth = 1;
    for (let x = -off; x < W; x += grid) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = -off; y < H; y += grid) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    const cx = W / 2;
    const cy = H / 2 - 40;
    const scale = Math.min(W / 700, H / 600) * 1.2;

    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    // Свечение за Игорем
    const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 180);
    glow.addColorStop(0, "rgba(255, 120, 30, 0.25)");
    glow.addColorStop(1, "rgba(255, 120, 30, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 180, 0, Math.PI * 2);
    ctx.fill();

    // Тело Игоря
    ctx.fillStyle = "#3c64a0";
    ctx.fillRect(-30, 20, 60, 70);

    // Голова
    ctx.fillStyle = "#ffc896";
    ctx.beginPath();
    ctx.arc(0, 0, 32, 0, Math.PI * 2);
    ctx.fill();

    // Рыжий ирокез (треугольники)
    ctx.fillStyle = "#ff781e";
    const spikes = [-24, -12, 0, 12, 24];
    for (let i = 0; i < spikes.length; i++) {
      const sx = spikes[i];
      const h = (i === 2) ? 38 : (i === 1 || i === 3) ? 30 : 22;
      ctx.beginPath();
      ctx.moveTo(sx - 8, -22);
      ctx.lineTo(sx, -22 - h);
      ctx.lineTo(sx + 8, -22);
      ctx.closePath();
      ctx.fill();
    }

    // Глаза
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(-10, -2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -2, 4, 0, Math.PI * 2); ctx.fill();

    // Рот
    ctx.strokeStyle = "#8c0a0a";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-8, 14); ctx.lineTo(8, 14); ctx.stroke();

    // Ружьё
    ctx.strokeStyle = "#505050";
    ctx.lineWidth = 10;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(30, 50);
    ctx.lineTo(80, 30);
    ctx.stroke();
    ctx.fillStyle = "#282828";
    ctx.beginPath(); ctx.arc(80, 30, 6, 0, Math.PI * 2); ctx.fill();

    // Кровь на ружье
    ctx.fillStyle = "#8a0a0a";
    ctx.beginPath(); ctx.arc(70, 35, 4, 0, Math.PI * 2); ctx.fill();

    ctx.restore();

    // Надпись RYZHYDENT IGOR
    ctx.save();
    ctx.globalAlpha = fade;

    const titleY = H / 2 + 120;
    const titleSize = Math.min(W / 12, 64);

    ctx.font = "bold " + titleSize + "px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Обводка
    ctx.strokeStyle = "#000";
    ctx.lineWidth = titleSize / 8;
    ctx.strokeText("RYZHYDENT IGOR", W / 2, titleY);

    // Заливка оранжевым градиентом
    const grad = ctx.createLinearGradient(0, titleY - titleSize/2, 0, titleY + titleSize/2);
    grad.addColorStop(0, "#ffb840");
    grad.addColorStop(0.5, "#ff781e");
    grad.addColorStop(1, "#c84010");
    ctx.fillStyle = grad;
    ctx.fillText("RYZHYDENT IGOR", W / 2, titleY);

    // Подзаголовок
    ctx.font = "bold " + (titleSize * 0.4) + "px Arial";
    ctx.fillStyle = "#ffc896";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = titleSize * 0.06;
    ctx.strokeText("РЫЖИДЕНТ ИГОРЬ", W / 2, titleY + titleSize * 0.9);
    ctx.fillText("РЫЖИДЕНТ ИГОРЬ", W / 2, titleY + titleSize * 0.9);

    // Подсказка "Нажми, чтобы начать"
    if (t > 0.8) {
      const pulse = 0.5 + 0.5 * Math.sin(t * 4);
      ctx.globalAlpha = fade * pulse;
      ctx.font = "bold " + (titleSize * 0.35) + "px Arial";
      ctx.fillStyle = "#ffdc3c";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = titleSize * 0.05;
      const hintY = titleY + titleSize * 1.8;
      ctx.strokeText("НАЖМИ, ЧТОБЫ НАЧАТЬ", W / 2, hintY);
      ctx.fillText("НАЖМИ, ЧТОБЫ НАЧАТЬ", W / 2, hintY);
    }

    ctx.restore();
  }

  // ---- Переходы ----
  function startGame() {
    ensureAudio();
    SFX.start();
    screenMode = "game";
    document.getElementById("ui").classList.add("visible");
    resetState();
  }
  window.startGame = startGame;

  window.restart = function() {
    ensureAudio();
    resetState();
  };

  // ---- Главный цикл ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (screenMode === "splash") {
      splashTime += dt;
      drawSplash();
    } else {
      update(dt);
      render();
    }

    requestAnimationFrame(loop);
  }

  // ---- Обработчики для старта ----
  canvas.addEventListener("click", function() {
    if (screenMode === "splash") startGame();
  });
  canvas.addEventListener("touchstart", function(e) {
    if (screenMode === "splash") {
      e.preventDefault();
      startGame();
    }
  }, { passive: false });
  window.addEventListener("keydown", function(e) {
    if (screenMode === "splash" && (e.key === " " || e.key === "Enter")) {
      e.preventDefault();
      startGame();
    }
  });

  // ---- Старт ----
  resetState();
  document.getElementById("ui").classList.remove("visible");
  requestAnimationFrame(loop);
})();
</script>
</body>
